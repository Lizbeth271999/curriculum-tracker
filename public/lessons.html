<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Curriculum — Lesson Planner</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="lessons">
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main">
      <div class="page-header">
        <h1>Lesson Planner</h1>
        <p>Week-by-week plan of what you're studying and when it's due.</p>
      </div>

      <div class="card">
        <div class="toolbar">
          <input class="search-input" id="search" placeholder="Search lessons…" />
          <button class="btn btn-primary" id="add-btn">+ New Lesson</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Lesson</th>
                <th>Curriculum</th>
                <th>Week</th>
                <th>Module</th>
                <th>Resource</th>
                <th>Due</th>
                <th style="text-align:center;">Done</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="empty" class="empty-state" style="display:none;">No lessons planned yet. Add your first one above.</div>
      </div>
    </main>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/lessons.js"></script>
</body>
</html>
