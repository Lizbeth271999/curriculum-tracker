<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Curriculum — Curriculum Library</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="library">
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main">
      <div class="page-header">
        <h1>Curriculum Library</h1>
        <p>The master list of every curriculum you're learning, on deck, or have finished.</p>
      </div>

      <div class="card">
        <div class="toolbar">
          <input class="search-input" id="search" placeholder="Search curriculums…" />
          <button class="btn btn-primary" id="add-btn">+ New Curriculum</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Status</th>
                <th>Start</th>
                <th>End</th>
                <th>Outcome goal</th>
                <th style="width:140px;">Progress</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="empty" class="empty-state" style="display:none;">No curriculums yet. Add your first one above.</div>
      </div>
    </main>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/library.js"></script>
</body>
</html>
