<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Curriculum — Habit Tracker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="habits">
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main">
      <div class="page-header">
        <h1>Habit Integration Tracker</h1>
        <p>The daily and weekly habits that turn your curriculum into a lifestyle.</p>
      </div>

      <div class="card">
        <div class="toolbar">
          <input class="search-input" id="search" placeholder="Search habits…" />
          <button class="btn btn-primary" id="add-btn">+ New Habit</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Habit</th>
                <th>Curriculum</th>
                <th>Frequency</th>
                <th>Current streak</th>
                <th>Success rate</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="empty" class="empty-state" style="display:none;">No habits yet. Add your first one above.</div>
      </div>
    </main>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/habits.js"></script>
</body>
</html>
