<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Curriculum — Reflection Journal</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="journal">
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main">
      <div class="page-header">
        <h1>Reflection Journal</h1>
        <p>Slow down and process what you're learning, and what it's changing.</p>
      </div>

      <div class="card">
        <div class="toolbar">
          <input class="search-input" id="search" placeholder="Search reflections…" />
          <button class="btn btn-primary" id="add-btn">+ New Reflection</button>
        </div>
      </div>

      <div id="entries"></div>
      <div id="empty" class="empty-state" style="display:none;">No reflections yet. Add your first one above.</div>
    </main>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/journal.js"></script>
</body>
</html>
